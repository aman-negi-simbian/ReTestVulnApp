<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>XSS Demo</title>
</head>
<body>
  <h1>XSS Vulnerability Demo</h1>

  <p>Current State: <span id="currentState">2</span></p>

  <form id="searchForm">
    <input type="text" id="searchInput" placeholder="Enter search query">
    <button type="submit">Search</button>
  </form>

  <br>
  <br>
  <button id="vulnerableBtn" data-state="MAKE_VULNERABLE">2</button>
  <button id="partialBtn" data-state="FIX_PARTIALLY">1</button>
  <button id="fixBtn" data-state="FIX_COMPLETELY">0</button>

  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const currentStateSpan = document.getElementById('currentState');
    const vulnerableBtn = document.getElementById('vulnerableBtn');
    const partialBtn = document.getElementById('partialBtn');
    const fixBtn = document.getElementById('fixBtn');

    // Load current state on page load
    async function loadState() {
      try {
        const response = await fetch('/api/state');
        const data = await response.json();
        updateStateDisplay(data.state);
      } catch (error) {
        console.error('Error loading state:', error);
      }
    }

    // Map state to encoded number
    const stateToCode = {
      'MAKE_VULNERABLE': '2',
      'FIX_PARTIALLY': '1',
      'FIX_COMPLETELY': '0'
    };

    // Update state display
    function updateStateDisplay(state) {
      currentStateSpan.textContent = stateToCode[state] || state;
    }

    // Handle state buttons
    [vulnerableBtn, partialBtn, fixBtn].forEach(btn => {
      btn.addEventListener('click', async () => {
        const newState = btn.getAttribute('data-state');
        try {
          const response = await fetch('/api/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ state: newState })
          });
          const data = await response.json();
          if (data.success) {
            updateStateDisplay(newState);
          }
        } catch (error) {
          console.error('Error updating state:', error);
        }
      });
    });

    // Handle search form
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = encodeURIComponent(searchInput.value);
      window.location.href = `/search?q=${query}`;
    });

    // Load initial state
    loadState();
  </script>
</body>
</html>
